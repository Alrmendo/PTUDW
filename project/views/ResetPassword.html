<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/image/thread.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threads - Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/app.css">
</head>

<body>
    <div class="flex flex-col justify-center items-center min-h-screen">
        <!-- Form khôi phục mật khẩu -->
        <form id="reset-password-form" method="post"
            class="w-full max-w-sm p-6 bg-white rounded-lg shadow-md border border-[#CCD0D5]"
            onsubmit="handleResetPassword(event)">
            <div class="text-center mb-6">
                <img src="/images/thread.ico" alt="Logo" class="w-12 h-12 mx-auto">
                <p class="text-lg font-semibold text-black mt-2">Enter a new password!</p>
            </div>

            <div class="mb-4">
                <input type="password" id="new-password" name="new-password" placeholder="New password"
                    class="w-full px-4 py-3 bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required>
            </div>

            <div class="mb-4">
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter new password"
                    class="w-full px-4 py-3 bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required>
            </div>

            <button type="submit" id="submitButton"
                class="w-full py-3 bg-blue-600 rounded-lg font-semibold text-white hover:bg-blue-500 disabled:cursor-not-allowed disabled:bg-blue-500 disabled:text-[rgba(255,255,255,0.4)]"
                disabled>
                Reset password.
            </button>
        </form>

        <!-- Footer -->
        <footer class="mt-6 text-center text-sm text-gray-500">
            <p>© 2024 Threads</p>
            <div class="flex justify-center space-x-4 mt-2">
                <a href="#" class="hover:underline">Terms of Threads</a>
                <a href="#" class="hover:underline">Privacy Policy</a>
                <a href="#" class="hover:underline">Cookie Policy</a>
                <a href="#" class="hover:underline">Report an issue</a>
            </div>
        </footer>
    </div>

    <script>
        const newPasswordInput = document.getElementById('new-password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        const submitButton = document.getElementById('submitButton');

        // Lấy token từ query string
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        async function handleResetPassword(event) {
            event.preventDefault();

            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // Kiểm tra mật khẩu có khớp không
            if (newPassword !== confirmPassword) {
                showError("The passwords do not match. Please try again.");
                return;
            }

            // Kiểm tra độ dài mật khẩu
            if (newPassword.length < 6 || newPassword.length > 20) {
                showError("The password must be between 6 and 20 characters.");
                return;
            }

            submitButton.disabled = true;
            try {
                // Gửi yêu cầu đặt lại mật khẩu với token
                const response = await fetch('http://localhost:3000/api/get-new-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password: newPassword, token })
                });
                const data = await response.json();

                if (response.ok) {
                    showError("Password reset successful!");
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    showError(`Error: ${data.message}`);
                }
            } catch (error) {
                console.error(error);
                showError("An error occurred. Please try again!");
            } finally {
                submitButton.disabled = false;
            }
        }
    </script>

</body>

</html>
