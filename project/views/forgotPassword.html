<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khôi phục mật khẩu</title>
    <link rel="icon" href="/image/thread.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/Custom.css">
</head>

<body class="bg-[rgb(250,250,250)] text-white">
    <div class="flex flex-col justify-center items-center min-h-screen">
        <!-- Form khôi phục mật khẩu -->
        <form method="post" action="/forgotPassword" class="w-full max-w-sm p-6 bg-white rounded-lg shadow-md border border-[#CCD0D5]">
            <div class="text-center mb-6">
                <img src="/images/thread.ico" alt="Logo" class="w-12 h-12 mx-auto">
                <p class="text-lg font-semibold text-black mt-2">Restore password!</p>
            </div>

            <!-- Input Email -->
            <div class="mb-4">
                <input type="email" id="email" name="email" placeholder="Enter your email"
                    class="w-full px-4 py-3 bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required>
            </div>

            <!-- Nút Gửi -->
            <button type="submit" id="submitButton"
                class="w-full py-3 bg-blue-600 rounded-lg font-semibold text-white hover:bg-blue-500 disabled:cursor-not-allowed disabled:bg-blue-500 disabled:text-[rgba(255,255,255,0.4)]"
                disabled>
                Send link to email
            </button>

            <!-- Quay lại đăng nhập -->
            <a href="/login" class="block text-center text-sm text-gray-400 mt-4 hover:underline">
                Return to sign in
            </a>

            <!-- Hoặc -->
            <div class="flex items-center my-6 text-gray-400">
                <hr class="flex-grow border-gray-600">
                <span class="mx-3">Or</span>
                <hr class="flex-grow border-gray-600">
            </div>

            <!-- Nút Đăng ký -->
            <a href="/signup"
                class="block text-center py-3 bg-gray-700 rounded-lg font-semibold text-white hover:bg-gray-600">
                Sign up
            </a>
        </form>

        <!-- Footer -->
        <footer class="mt-6 text-center text-sm text-gray-500">
            <p>© 2024 Threads</p>
            <div class="flex justify-center space-x-4 mt-2">
                <a href="#" class="hover:underline">Terms of Threads</a>
                <a href="#" class="hover:underline">Privacy Policy</a>
                <a href="#" class="hover:underline">Cookie Policy</a>
                <a href="#" class="hover:underline">Report an issue</a>
            </div>
        </footer>
    </div>
    <script>
        const emailInput = document.getElementById("email");
        const submitButton = document.getElementById("submitButton");

        emailInput.addEventListener("input", () => {
            // Kích hoạt nút gửi nếu email không trống
            submitButton.disabled = !emailInput.value.trim();
        });
    </script>
</body>

</html>
